# Everything runs in Docker: dependencies, workers, dashboard and tests.
# No Docker socket is mounted anywhere -- services talk by DNS name and
# Toxiproxy is driven over its HTTP API.
name: worker-health

x-worker-env: &worker-env
  # Workers reach every dependency THROUGH Toxiproxy, so a fault can be
  # injected against a running fleet without restarting anything.
  PG_HOST: toxiproxy
  PG_PORT: "18432"
  PG_USER: app
  PG_PASSWORD: canary-pg-8f3ad91c
  PG_DB: app
  MQ_HOST: toxiproxy
  MQ_PORT: "18672"
  MQ_USER: app
  MQ_PASSWORD: canary-mq-4b7ce02d
  RD_HOST: toxiproxy
  RD_PORT: "18379"
  RD_PASSWORD: canary-rd-1a9fe63b
  LOG_LEVEL: INFO
  HEALTH_PORT: "8080"
  PREFETCH: "10"
  BOOT_GRACE: "25"
  MAX_IDLE: "45"
  MAX_SINCE_SUCCESS: "90"
  BACKLOG_THRESHOLD: "500"
  # Controlled restart is OFF by default. Set to true to arm it; the policy
  # only ever exits the process and lets the supervisor restart it.
  RESTART_ENABLED: "false"
  PYTHONPATH: /app/workers

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: canary-pg-8f3ad91c
      POSTGRES_DB: app
    # Small max_connections keeps server exhaustion distinguishable from
    # application-pool exhaustion, which are different findings.
    command: postgres -c max_connections=60 -c log_connections=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["${PG_HOST_PORT:-15432}:5432"]

  rabbitmq:
    image: rabbitmq:3.10-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: canary-mq-4b7ce02d
    healthcheck:
      # The focused diagnostics, both present since 3.8. /api/aliveness-test
      # is deliberately NOT used: on 3.10 it declares a queue, publishes and
      # consumes a message, which would violate the non-destructive rule
      # this project is built on. It became a no-op only in 4.0.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    ports: ["${MQ_HOST_PORT:-15673}:5672", "${MQ_MGMT_PORT:-15672}:15672"]
    # Ephemeral data dir. The demo stack keeps no broker state between runs,
    # and an anonymous volume can come back with ownership the rabbitmq user
    # cannot read (".erlang.cookie: eacces").
    tmpfs:
      - /var/lib/rabbitmq

  redis:
    # Pinned to the version in the target environment. 7.2 implements HELLO,
    # so RESP2/RESP3 negotiation is a non-issue and build_client() leaves the
    # protocol at the client default -- see checks/redis_.py.
    image: redis:7.2-alpine
    # maxmemory is set deliberately: without it, memory_ratio has no
    # denominator and the memory-pressure path can never be demonstrated.
    command: >
      redis-server --requirepass canary-rd-1a9fe63b
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a canary-rd-1a9fe63b ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["${RD_HOST_PORT:-16379}:6379"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./docker/toxiproxy.json:/etc/toxiproxy.json:ro
    ports: ["${TOXIPROXY_PORT:-8474}:8474"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 15

  billing:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: ["python", "worker_billing.py"]
    environment:
      <<: *worker-env
      SERVICE: billing
      HEALTH_INSTANCE: billing-1
      IN_QUEUE: billing.in
      OUT_QUEUE: billing.out
      AUDIT_QUEUE: billing.audit
    depends_on:
      toxiproxy: {condition: service_started}
      postgres:  {condition: service_healthy}
      rabbitmq:  {condition: service_healthy}
      redis:     {condition: service_healthy}
    ports: ["${BILLING_PORT:-8081}:8080"]
    restart: unless-stopped

  notify:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: ["python", "worker_notify.py"]
    environment:
      <<: *worker-env
      SERVICE: notify
      HEALTH_INSTANCE: notify-1
      IN_QUEUE: billing.out
    depends_on:
      billing: {condition: service_started}
    ports: ["${NOTIFY_PORT:-8082}:8080"]
    restart: unless-stopped

  reconcile:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: ["python", "worker_reconcile.py"]
    environment:
      <<: *worker-env
      SERVICE: reconcile
      HEALTH_INSTANCE: reconcile-1
      IN_QUEUE: billing.audit
    depends_on:
      billing: {condition: service_started}
    ports: ["${RECONCILE_PORT:-8083}:8080"]
    restart: unless-stopped

  loadgen:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: ["python", "loadgen.py"]
    environment:
      <<: *worker-env
      SERVICE: loadgen
      RATE: "8"
      CONTROL_PORT: "8090"
    depends_on:
      billing: {condition: service_started}
    ports: ["${LOADGEN_PORT:-8090}:8090"]
    # The load generator is not a health-reporting worker; it inherits the
    # worker image but serves only its control port, so the image's default
    # HEALTHCHECK does not apply to it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  dashboard:
    build: {context: ., dockerfile: docker/Dockerfile.dashboard}
    environment:
      PORT: "9000"
      POLL_INTERVAL: "1.0"
      WORKERS: "billing=http://billing:8080,notify=http://notify:8080,reconcile=http://reconcile:8080"
      LOADGEN_URL: "http://loadgen:8090"
    depends_on:
      billing: {condition: service_started}
    ports: ["${DASHBOARD_PORT:-9000}:9000"]
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: tests
    profiles: ["test"]
    working_dir: /app
    command: ["pytest", "-q", "tests"]
    environment:
      <<: *worker-env
      TOXIPROXY_URL: http://toxiproxy:8474
      BILLING_URL: http://billing:8080
      NOTIFY_URL: http://notify:8080
      RECONCILE_URL: http://reconcile:8080
      PYTHONPATH: /app/src:/app/workers:/app
    depends_on:
      toxiproxy: {condition: service_started}
      postgres:  {condition: service_healthy}
      rabbitmq:  {condition: service_healthy}
      redis:     {condition: service_healthy}
