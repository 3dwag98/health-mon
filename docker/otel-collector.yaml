# Minimal OTLP receiver for the demo stack.
#
# The workers push here; this writes a one-line summary per batch to its own
# stdout (`docker compose logs otel-collector`) and exposes a health endpoint
# the tests poll. Nothing is forwarded anywhere -- the point is to prove the
# push path works, not to run an observability backend in a demo.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic
  # Fan the same stream out to the fleet dashboard. This is the realistic
  # topology: workers push once, to the collector they already know about,
  # and the collector decides who else needs a copy. Nothing in a worker has
  # to know the dashboard exists.
  otlphttp/dashboard:
    endpoint: http://dashboard:9000
    encoding: json
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
    sending_queue:
      enabled: true
      queue_size: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/dashboard]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    metrics:
      # The collector's own self-telemetry is served here, and it is what the
      # integration test reads to prove the workers' payloads were ACCEPTED
      # rather than merely sent.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
